name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, upload assets
      id-token: write # OIDC token Sigstore signs the provenance with
      attestations: write # store the signed provenance on the repo, so `gh attestation verify` can find it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: Publish resolves the previous release tag

      - name: Verify action.yml pins this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PINNED=$(sed -n 's/^[[:space:]]*SAST_TRIAGE_VERSION:[[:space:]]*//p' action.yml | head -1)
          if [ -z "$PINNED" ]; then
            echo "::error file=action.yml::SAST_TRIAGE_VERSION not found — has the download step been renamed or removed?"
            exit 1
          fi
          if [ "$PINNED" != "$TAG" ]; then
            echo "::error file=action.yml::action.yml pins SAST_TRIAGE_VERSION: $PINNED but this release is $TAG."
            echo "::error::Consumers of $TAG would download the $PINNED binary. Set it to $TAG, commit, and move the tag onto that commit."
            exit 1
          fi
          echo "action.yml pins $PINNED, matching the tag being released"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/sast-triage_${os}_${arch}" ./cmd/sast-triage
          done
          (cd dist && sha256sum sast-triage_* > checksums.txt)
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/sast-triage_*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          # Left to itself, --generate-notes diffs against the newest tag on the
          # commit, which is the floating `v1` alias — same commit, so an empty
          # changelog. Ask for the previous x.y.z tag explicitly. --match skips
          # the alias; ${TAG}^ starts the search below this release, so re-running
          # a tag never diffs it against itself. Empty on the first release, where
          # --notes-start-tag is simply omitted.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true)
          notes=(--generate-notes)
          if [ -n "$PREV" ]; then
            echo "generating notes from $PREV to $TAG"
            notes+=(--notes-start-tag "$PREV")
          else
            echo "::notice::no earlier release tag found; notes cover the full history"
          fi
          gh release create "$TAG" dist/* "${notes[@]}"

